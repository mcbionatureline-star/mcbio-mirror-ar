<!DOCTYPE html>
<html lang="it">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>MC Bio Nature - Luxury Experience</title>
   <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
   <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
   <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
   <style>
       :root { --gold: #c5a059; --dark: #070807; --white: #ffffff; }
       body { margin: 0; background: var(--dark); font-family: 'Montserrat', sans-serif; color: var(--white); overflow: hidden; width: 100vw; height: 100vh; }
       #mirror-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
       video, canvas { position: absolute; height: 100%; width: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }

       #welcome-screen {
           position: absolute; z-index: 2000; inset: 0;
           background-image: url('sfondo-benvenuto.jpg'); background-size: cover; background-position: center;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           transition: opacity 1s ease;
       }
       #welcome-screen::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%); z-index: -1; }

       .welcome-content { text-align: center; max-width: 85%; z-index: 10; }
       .logo-img { width: 180px; margin-bottom: 25px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
       .welcome-text { font-family: 'Montserrat', sans-serif; font-weight: 200; text-transform: uppercase; color: var(--white); letter-spacing: 3px; font-size: 0.9rem; line-height: 1.8; margin-bottom: 40px; }
       
       .path-btn { width: 280px; padding: 18px; border: 1px solid var(--gold); background: rgba(197,160,89,0.1); color: var(--gold); font-family: 'Cinzel', serif; margin-bottom: 18px; letter-spacing: 4px; cursor: pointer; text-align: center; text-transform: uppercase; font-size: 0.8rem; transition: 0.4s; }
       .path-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(197,160,89,0.5); }

       #info-panel { position: absolute; top: 25px; width: 400px; background: rgba(0,0,0,0.85); padding: 20px; border: 1px solid var(--gold); display: none; z-index: 1000; backdrop-filter: blur(10px); border-radius: 4px; }
       #p-name { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.1rem; margin: 0; text-align: center; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid rgba(197,160,89,0.3); padding-bottom: 10px; }
       
       .buy-row { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
       .btn-buy { background: var(--gold); color: #000; padding: 10px 20px; text-decoration: none; font-weight: 700; font-size: 0.7rem; letter-spacing: 1px; border-radius: 2px; }
       
       /* QR Container con istruzione */
       .qr-box { display: flex; flex-direction: column; align-items: center; gap: 5px; }
       #qrcode { background: white; padding: 5px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
       #qrcode:hover { transform: scale(1.05); }
       .sim-note { margin: 12px 0 0; text-align: center; color: rgba(255,255,255,0.55); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
       #compare { position: absolute; top: 0; bottom: 0; left: 50%; width: 48px; margin-left: -24px; z-index: 900; touch-action: none; display: none; cursor: ew-resize; }
       #compare::before { content: ''; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: rgba(197,160,89,0.85); }
       #cmp-handle { position: absolute; top: 55%; left: 4px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold); background: rgba(0,0,0,0.65); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: -2px; }
       .cmp-label { position: absolute; top: calc(55% + 52px); font-size: 9px; letter-spacing: 2px; color: #fff; text-shadow: 0 1px 3px #000; white-space: nowrap; }
       #cmp-before { right: 30px; }
       #cmp-after { left: 30px; }
       .qr-tip { color: var(--gold); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; animation: pulse 2s infinite; }

       @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

       #product-ui { position: absolute; bottom: 120px; width: 100%; display: none; justify-content: center; z-index: 1000; }
       .shelf { display: flex; gap: 10px; padding: 10px; overflow-x: auto; max-width: 95%; scrollbar-width: none; background: rgba(0,0,0,0.4); border-radius: 50px; }
       .prod-item { padding: 12px 20px; border: 1px solid var(--gold); background: #000; color: var(--gold); font-size: 0.65rem; white-space: nowrap; cursor: pointer; font-weight: 600; letter-spacing: 1px; }
       .prod-item.active { background: var(--gold); color: #000; transform: scale(1.05); box-shadow: 0 0 15px var(--gold); }
       .btn-back { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: var(--gold); font-size: 0.6rem; text-decoration: none; border-bottom: 1px solid var(--gold); z-index: 1100; display:none; letter-spacing: 2px; cursor: pointer; }
   </style>
</head>
<body>
<div id="mirror-container">
   <video id="input_video" style="display:none"></video>
   <canvas id="output_canvas"></canvas>
   
   <div id="welcome-screen">
       <div class="welcome-content">
           <img src="logo.jpg" class="logo-img">
           <p class="welcome-text">Benvenuta nel mondo della cosmetica naturale di<br><strong>MCBIONATURELINE</strong></p>
           <div class="path-btn" onclick="openPath('pura')">PURA LINFA</div>
           <div class="path-btn" onclick="openPath('sorgente')">SORGENTE</div>
           <div class="path-btn" onclick="openPath('forza')">FORZA NATURA</div>
           <div class="path-btn" onclick="openPath('makeup')">MAKE-UP</div>
       </div>
   </div>

   <div id="info-panel">
       <h2 id="p-name"></h2>
       <div class="buy-row">
           <a id="buy-link" href="#" target="_blank" class="btn-buy">ESPLORA SUL SITO</a>
           <div class="qr-box">
               <div id="qrcode" onclick="window.open(document.getElementById('buy-link').href, '_blank')"></div>
               <span class="qr-tip">Tocca il QR per acquistare</span>
           </div>
       </div>
       <p class="sim-note">Simulazione indicativa: il risultato reale può variare</p>
   </div>
   <div id="compare"><div id="cmp-handle"><svg width="22" height="14" viewBox="0 0 22 14"><path d="M7 1L2 7l5 6M15 1l5 6-5 6" fill="none" stroke="#c5a059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span id="cmp-before" class="cmp-label">PRIMA</span><span id="cmp-after" class="cmp-label">DOPO</span></div>
   <div id="btn-reset" class="btn-back" onclick="location.reload()">TORNA AI PERCORSI</div>
   <div id="product-ui"><div id="shelf-list" class="shelf"></div></div>
</div>

<script>
const SITE = "https://mcbionatureline.com"; 

const DATABASE = {
   'pura': [
       { name: 'MOUSSE AL LIMONE', url: '/product/mousse-detergente-al-limone/', color:'#FFF176', soft:0.42, shine:0.05, smooth:0.10, even:0.30, glow:0.10 },
       { name: 'TONICO RINFRESCANTE', url: '/product/tonico-viso-idratante-rinfrescante/', color:'#B3E5FC', soft:0.40, shine:0.02, smooth:0.12, even:0.30, glow:0.12 },
       { name: 'SIERO ENZIMATICO', url: '/product/siero-esfoliante-enzimatico/', color:'#E6EE9C', soft:0.40, shine:0.05, smooth:0.22, even:0.35, glow:0.10 }
   ],
   'sorgente': [
       { name: 'SIERO IDRATANTE', url: '/product/siero-viso-idratante-lenitivo/', color:'#81D4FA', soft:0.40, shine:0.03, smooth:0.12, even:0.25, glow:0.28 },
       { name: 'SIERO RIVITALIZZANTE', url: '/product/siero-anti-age-rivitalizzante/', color:'#D7B8E8', soft:0.38, shine:0.05, smooth:0.12, even:0.40, glow:0.25 },
       { name: 'FILLER LIFTING', url: '/product/filler-effetto-lifting/', color:'#E0F7FA', soft:0.40, shine:0.02, smooth:0.30, even:0.20, glow:0.12 },
       { name: 'CONTORNO OCCHI', url: '/product/contorno-occhi-con-effetto-schiarente/', color:'#E0E0E0', eyesOnly: true, legacy: true, smooth:0.12, even:0.28 }
   ],
   'forza': [
       { name: 'CREMA ANTI-AGE', url: '/product/crema-intensiva-anti-age/', color:'#F4A6A0', soft:0.38, shine:0.05, smooth:0.25, even:0.35, glow:0.14 },
       { name: 'CREMA NUTRIENTE 24H', url: '/product/crema-viso-nutriente-24-h-idratazione-intensa-e-prolungata/', color:'#F5D98B', soft:0.48, shine:0.07, smooth:0.12, even:0.25, glow:0.24 },
       { name: 'CREMA MANTENIMENTO', url: '/product/crema-intensiva-naturale-di-mantenimento/', color:'#A5E8CF', soft:0.38, shine:0.05, smooth:0.12, even:0.30, glow:0.12 }
   ],
   'makeup': [
       { name: 'ROSSETTO DUSTY ROSE', url: '/?s=rossetto&post_type=product', kind:'lips', color:'#B8837D', cover:0.50 },
       { name: 'ROSSETTO TERRACOTTA NUDE', url: '/?s=rossetto&post_type=product', kind:'lips', color:'#C4846F', cover:0.50 },
       { name: 'FONDOTINTA 10 LIGHT WARM', url: '/?s=fondotinta&post_type=product', color:'#E9C3A3', cover:0.48, lift:0.25, smooth:0.10, even:0.15, soft:0.20, shine:0.02 },
       { name: 'FONDOTINTA 20 MEDIUM NEUTRAL', url: '/?s=fondotinta&post_type=product', color:'#D49C74', cover:0.48, deep:0.25, smooth:0.10, even:0.15, soft:0.20, shine:0.02 },
       { name: 'CORRETTORE 10 LIGHT WARM', url: '/?s=correttore&post_type=product', eyesOnly:true, color:'#F0C4A6', cover:0.62, smooth:0.12, even:0.15, soft:0.20, shine:0.05 },
       { name: 'CORRETTORE 20 MEDIUM WARM', url: '/?s=correttore&post_type=product', eyesOnly:true, color:'#DDA07A', cover:0.62, smooth:0.12, even:0.15, soft:0.20, shine:0.05 },
       { name: 'MASCARA ALLUNGANTE E VOLUMIZZANTE', url: '/?s=mascara&post_type=product', kind:'mascara', color:'#120d0c' }
   ]
};

let activeConf = null;
let appearStart = 0;

function openPath(id) {
   document.getElementById('welcome-screen').style.opacity = '0';
   setTimeout(() => {
       document.getElementById('welcome-screen').style.display = 'none';
       document.getElementById('product-ui').style.display = 'flex';
       document.getElementById('btn-reset').style.display = 'block';
       document.getElementById('info-panel').style.display = 'block';
       document.getElementById('compare').style.display = 'block';
   }, 800);
   const shelf = document.getElementById('shelf-list');
   shelf.innerHTML = '';
   DATABASE[id].forEach((p, index) => {
       const item = document.createElement('div');
       item.className = 'prod-item';
       item.innerText = p.name;
       item.onclick = () => {
           document.querySelectorAll('.prod-item').forEach(i => i.classList.remove('active'));
           item.classList.add('active');
           displayProduct(p);
       };
       shelf.appendChild(item);
       if(index === 0) item.click(); 
   });
}

function displayProduct(p) {
   document.getElementById('p-name').innerText = p.name;
   document.getElementById('buy-link').href = SITE + p.url;
   document.getElementById('qrcode').innerHTML = '';
   new QRCode(document.getElementById('qrcode'), { text: SITE + p.url, width: 60, height: 60 });
   activeConf = p;
   appearStart = performance.now();
}


const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');

// ---------- Confronto PRIMA / DOPO (trascina la linea dorata) ----------
// 0.5 = metà schermo; 0 = tutto "dopo"; 1 = tutto "prima"
let split = 0.5;

// INTENSITA' DEGLI EFFETTI: 1 = delicato, 1.6 = visibile, 2 = deciso
const INTENSITA = 2.4;
const cmp = document.getElementById('compare');
let dragging = false;
function setSplit(fr) { split = Math.min(1, Math.max(0, fr)); cmp.style.left = (split * 100) + '%'; }
function fracFromX(x) { const r = canvasElement.getBoundingClientRect(); return (x - r.left) / r.width; }
cmp.addEventListener('pointerdown', (e) => { dragging = true; cmp.setPointerCapture(e.pointerId); setSplit(fracFromX(e.clientX)); });
cmp.addEventListener('pointermove', (e) => { if (dragging) setSplit(fracFromX(e.clientX)); });
cmp.addEventListener('pointerup', () => { dragging = false; });
cmp.addEventListener('pointercancel', () => { dragging = false; });

// ---------- Livelli di lavoro a bassa risoluzione ----------
const LS = 6;    // fattore per maschera, levigatura, luci
const LE = 16;   // fattore per uniformare il colore della pelle
function mk() { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; }
const halfL = mk(), blurS = mk(), blurE = mk(), maskS = mk(), tmpS = mk(), tmpE = mk(), lipM = mk(), lipT = mk();

// ---------- Punti del viso ----------
const FACE = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const LEFT_EYE = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
const RIGHT_EYE = [362,398,384,385,386,387,388,466,263,249,390,373,374,380,381,382];
const LIPS = [61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];
const LEFT_BROW = [70,63,105,66,107,55,65,52,53,46];
const RIGHT_BROW = [300,293,334,296,336,285,295,282,283,276];
const LEFT_LOWER = [33,7,163,144,145,153,154,155,133];
const RIGHT_LOWER = [362,382,381,380,374,373,390,249,263];
const LIPS_INNER = [78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95];
const LEFT_UPPER = [33,246,161,160,159,158,157,173,133];
const RIGHT_UPPER = [362,398,384,385,386,387,388,466,263];

let dprNow = 1;
function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvasElement.getBoundingClientRect();
    const w = Math.max(2, Math.round(rect.width * dpr));
    const h = Math.max(2, Math.round(rect.height * dpr));
    if (canvasElement.width !== w || canvasElement.height !== h) {
        canvasElement.width = w; canvasElement.height = h;
        halfL.c.width = Math.ceil(w / 2); halfL.c.height = Math.ceil(h / 2);
        [lipM, lipT].forEach(o => { o.c.width = Math.ceil(w / 2); o.c.height = Math.ceil(h / 2); });
        [blurS, maskS, tmpS].forEach(o => { o.c.width = Math.ceil(w / LS); o.c.height = Math.ceil(h / LS); });
        [blurE, tmpE].forEach(o => { o.c.width = Math.ceil(w / LE); o.c.height = Math.ceil(h / LE); });
    }
    dprNow = dpr;
    return dpr;
}

function appearValue() {
    const t = Math.min(1, (performance.now() - appearStart) / 1800);   // effetto che "si applica" in 1,8 s
    return 1 - Math.pow(1 - t, 3);
}

function onResults(results) {
    const dpr = resizeCanvas();
    const W = canvasElement.width, H = canvasElement.height;
    const img = results.image;
    const iw = img.videoWidth || img.width, ih = img.videoHeight || img.height;

    // Il video riempie lo schermo SENZA deformarsi (come "cover")
    const scale = Math.max(W / iw, H / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;

    const ctx = canvasCtx;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.clearRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, dx, dy, dw, dh);

    if (!(results.multiFaceLandmarks && results.multiFaceLandmarks.length && activeConf)) return;
    const cfg = activeConf;
    const lm = results.multiFaceLandmarks[0];
    const pt = (i) => ({ x: dx + lm[i].x * dw, y: dy + lm[i].y * dh });
    const ap = appearValue();

    // 1) Copie sfocate del fotogramma (a più passaggi per evitare effetti a quadretti)
    halfL.x.imageSmoothingQuality = 'high';
    halfL.x.drawImage(img, dx / 2, dy / 2, dw / 2, dh / 2);
    blurS.x.imageSmoothingQuality = 'high';
    blurS.x.clearRect(0, 0, blurS.c.width, blurS.c.height);
    blurS.x.drawImage(halfL.c, 0, 0, blurS.c.width, blurS.c.height);
    blurE.x.imageSmoothingQuality = 'high';
    blurE.x.clearRect(0, 0, blurE.c.width, blurE.c.height);
    blurE.x.drawImage(blurS.c, 0, 0, blurE.c.width, blurE.c.height);

    // 2) Maschera morbida della pelle (occhi, sopracciglia e labbra esclusi)
    const m = maskS.x;
    const k = maskS.c.width / W;
    const OFF = W * 3;
    m.setTransform(1, 0, 0, 1, 0, 0);
    m.clearRect(0, 0, maskS.c.width, maskS.c.height);
    m.save();
    m.scale(k, k);
    m.shadowColor = '#000';
    m.shadowOffsetX = OFF * k;
    m.shadowOffsetY = 0;
    m.shadowBlur = 26 * dpr * k;          // morbidezza dei bordi
    m.fillStyle = '#000';
    m.beginPath();
    const addPoly = (ids) => {
        ids.forEach((idx, i) => {
            const p = pt(idx);
            if (i === 0) m.moveTo(p.x - OFF, p.y); else m.lineTo(p.x - OFF, p.y);
        });
        m.closePath();
    };
    if (cfg.eyesOnly) {
        [LEFT_LOWER, RIGHT_LOWER].forEach(lower => {
            const down = lower.map(idx => { const p = pt(idx); return { x: p.x - OFF, y: p.y + 0.035 * dh }; });
            lower.forEach((idx, i) => { const p = pt(idx); if (i === 0) m.moveTo(p.x - OFF, p.y); else m.lineTo(p.x - OFF, p.y); });
            down.reverse().forEach(p => m.lineTo(p.x, p.y));
            m.closePath();
        });
        m.fill();
    } else {
        addPoly(FACE); addPoly(LEFT_EYE); addPoly(RIGHT_EYE); addPoly(LIPS); addPoly(LEFT_BROW); addPoly(RIGHT_BROW);
        m.fill('evenodd');
    }
    m.restore();

    // 3) Applico gli effetti solo nella parte "DOPO" dello schermo
    // (il canvas è specchiato: la parte "dopo" a destra sullo schermo è a sinistra nel canvas)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W * (1 - split), H);
    ctx.clip();

    const maskInto = (t) => {
        t.x.globalCompositeOperation = 'destination-in';
        t.x.drawImage(maskS.c, 0, 0, t.c.width, t.c.height);
        t.x.globalCompositeOperation = 'source-over';
    };

    // Make-up: rossetto e mascara (solo nella parte "DOPO")
    if (cfg.kind === 'lips') {
        const k2 = lipM.c.width / W, o = W * 3, m2 = lipM.x;
        m2.setTransform(1, 0, 0, 1, 0, 0);
        m2.clearRect(0, 0, lipM.c.width, lipM.c.height);
        m2.save(); m2.scale(k2, k2);
        m2.shadowColor = '#000'; m2.shadowOffsetX = o * k2; m2.shadowOffsetY = 0; m2.shadowBlur = 2.5;
        m2.fillStyle = '#000'; m2.beginPath();
        [LIPS, LIPS_INNER].forEach(ids => {
            ids.forEach((idx, i) => { const q = pt(idx); if (i === 0) m2.moveTo(q.x - o, q.y); else m2.lineTo(q.x - o, q.y); });
            m2.closePath();
        });
        m2.fill('evenodd'); m2.restore();
        lipT.x.globalCompositeOperation = 'source-over';
        lipT.x.clearRect(0, 0, lipT.c.width, lipT.c.height);
        lipT.x.fillStyle = cfg.color; lipT.x.fillRect(0, 0, lipT.c.width, lipT.c.height);
        lipT.x.globalCompositeOperation = 'destination-in';
        lipT.x.drawImage(lipM.c, 0, 0);
        lipT.x.globalCompositeOperation = 'source-over';
        ctx.globalCompositeOperation = 'color'; ctx.globalAlpha = cfg.cover * ap;
        ctx.drawImage(lipT.c, 0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.30 * ap;
        ctx.drawImage(lipT.c, 0, 0, W, H);
    }
    if (cfg.kind === 'mascara') {
        const fw = Math.hypot(pt(454).x - pt(234).x, pt(454).y - pt(234).y);
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = cfg.color; ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 1.5 * dpr;
        // ciglia affusolate (spesse alla base, sottili in punta), fitte, curve verso l'alto e l'esterno
        const rnd = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
        ctx.fillStyle = cfg.color;
        const drawLashes = (arr, dir, len, count, baseW, alpha, outerAtStart, seed) => {
            let cx = 0;
            arr.forEach(idx => { cx += pt(idx).x; });
            cx /= arr.length;
            ctx.globalAlpha = alpha * ap;
            const w = Math.max(0.9 * dpr, fw * baseW);
            for (let i = 0; i < arr.length - 1; i++) {
                const a = pt(arr[i]), b = pt(arr[i + 1]);
                let tx = b.x - a.x, ty = b.y - a.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
                for (let st = 0; st < count; st++) {
                    const r1 = rnd(seed + i * 31 + st * 7), r2 = rnd(seed + i * 17 + st * 13 + 5);
                    const t = (st + r1 * 0.6) / count, u = (i + t) / (arr.length - 1);
                    const outer = outerAtStart ? (1 - u) : u;
                    const L = fw * len * (0.55 + 0.6 * outer) * (0.75 + 0.5 * r2);
                    const x0 = a.x + (b.x - a.x) * t, y0 = a.y + (b.y - a.y) * t;
                    const fan = Math.max(-1.6, Math.min(1.6, (x0 - cx) / (fw * 0.08)));
                    const c1x = x0 + fan * L * 0.12, c1y = y0 + dir * L * 0.7;
                    const tipx = x0 + fan * L * 0.45, tipy = y0 + dir * L * 0.97;
                    ctx.beginPath();
                    ctx.moveTo(x0 - tx * w / 2, y0 - ty * w / 2);
                    ctx.quadraticCurveTo(c1x - tx * w * 0.25, c1y - ty * w * 0.25, tipx, tipy);
                    ctx.quadraticCurveTo(c1x + tx * w * 0.25, c1y + ty * w * 0.25, x0 + tx * w / 2, y0 + ty * w / 2);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        };
        [[LEFT_UPPER, true, 1], [RIGHT_UPPER, false, 2]].forEach(([arr, outerAtStart, seed]) => {
            ctx.globalAlpha = 0.55 * ap; ctx.lineWidth = fw * 0.005; ctx.beginPath();
            arr.forEach((idx, i) => { const q = pt(idx); if (i === 0) ctx.moveTo(q.x, q.y); else ctx.lineTo(q.x, q.y); });
            ctx.stroke();
            drawLashes(arr, -1, 0.044, 8, 0.0019, 0.80, outerAtStart, seed * 100);
        });
        [[LEFT_LOWER, true, 3], [RIGHT_LOWER, false, 4]].forEach(([arr, outerAtStart, seed]) => drawLashes(arr, 1, 0.022, 4, 0.0016, 0.45, outerAtStart, seed * 100));
        ctx.shadowBlur = 0;
    }
    if (cfg.kind === 'lips' || cfg.kind === 'mascara') {
        ctx.restore();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
        return;
    }

    // a) Levigatura leggera: attenua le piccole imperfezioni ma lascia la texture
    if (cfg.smooth) {
        tmpS.x.clearRect(0, 0, tmpS.c.width, tmpS.c.height);
        tmpS.x.drawImage(blurS.c, 0, 0);
        maskInto(tmpS);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = Math.min(0.6, cfg.smooth * INTENSITA) * ap;
        ctx.drawImage(tmpS.c, 0, 0, W, H);
    }

    // b) Colorito più uniforme: meno arrossamenti e macchie, stessa luminosità
    if (cfg.even) {
        tmpE.x.clearRect(0, 0, tmpE.c.width, tmpE.c.height);
        tmpE.x.drawImage(blurE.c, 0, 0);
        maskInto(tmpE);
        ctx.globalCompositeOperation = 'color';
        ctx.globalAlpha = Math.min(0.9, cfg.even * INTENSITA) * ap;
        ctx.drawImage(tmpE.c, 0, 0, W, H);
    }

    // b2) Fondotinta / correttore: porta il colorito verso la tonalità del prodotto
    if (cfg.cover) {
        tmpS.x.globalCompositeOperation = 'source-over';
        tmpS.x.clearRect(0, 0, tmpS.c.width, tmpS.c.height);
        tmpS.x.fillStyle = cfg.color;
        tmpS.x.fillRect(0, 0, tmpS.c.width, tmpS.c.height);
        maskInto(tmpS);
        ctx.globalCompositeOperation = 'color';
        ctx.globalAlpha = cfg.cover * ap;
        ctx.drawImage(tmpS.c, 0, 0, W, H);
        if (cfg.lift) { ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = cfg.lift * ap; ctx.drawImage(tmpS.c, 0, 0, W, H); }
        if (cfg.deep) { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = cfg.deep * ap; ctx.drawImage(tmpS.c, 0, 0, W, H); }
    }

    // c) Velo di colore del prodotto (molto leggero)
    const tintMul = cfg.legacy ? 1 : 0.5;
    const tintA = (cfg.soft !== undefined ? cfg.soft : 0.6) * tintMul;
    const shineA = (cfg.shine !== undefined ? cfg.shine : 0.10) * tintMul;
    tmpS.x.globalCompositeOperation = 'source-over';
    tmpS.x.clearRect(0, 0, tmpS.c.width, tmpS.c.height);
    tmpS.x.fillStyle = cfg.color;
    tmpS.x.fillRect(0, 0, tmpS.c.width, tmpS.c.height);
    maskInto(tmpS);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.globalAlpha = tintA * ap;
    ctx.drawImage(tmpS.c, 0, 0, W, H);
    if (shineA > 0) {
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = shineA * ap;
        ctx.drawImage(tmpS.c, 0, 0, W, H);
    }

    // d) Luce "pelle idratata": riflessi su fronte, zigomi e mento
    if (cfg.glow && !cfg.eyesOnly) {
        const faceW = Math.hypot(pt(454).x - pt(234).x, pt(454).y - pt(234).y);
        const spots = [
            { p: pt(151), r: faceW * 0.20, dy: 0 },
            { p: pt(50),  r: faceW * 0.17, dy: -0.02 * dh },
            { p: pt(280), r: faceW * 0.17, dy: -0.02 * dh },
            { p: pt(152), r: faceW * 0.11, dy: -0.04 * dh }
        ];
        tmpS.x.globalCompositeOperation = 'source-over';
        tmpS.x.clearRect(0, 0, tmpS.c.width, tmpS.c.height);
        spots.forEach(sp => {
            const cx = sp.p.x / (W / tmpS.c.width), cy = (sp.p.y + sp.dy) / (H / tmpS.c.height), r = sp.r / (W / tmpS.c.width);
            const g = tmpS.x.createRadialGradient(cx, cy, 0, cx, cy, r);
            g.addColorStop(0, 'rgba(255,244,230,1)');
            g.addColorStop(1, 'rgba(255,244,230,0)');
            tmpS.x.fillStyle = g;
            tmpS.x.fillRect(0, 0, tmpS.c.width, tmpS.c.height);
        });
        maskInto(tmpS);
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = Math.min(0.35, cfg.glow * INTENSITA) * ap;
        ctx.drawImage(tmpS.c, 0, 0, W, H);
    }

    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
}

const faceMesh = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
faceMesh.onResults(onResults);

// Su telefono (verticale) chiediamo il video in verticale, in alta risoluzione
const portrait = window.innerHeight > window.innerWidth;
const camera = new Camera(videoElement, {
    onFrame: async () => { await faceMesh.send({image: videoElement}); },
    facingMode: 'user',
    width: portrait ? 720 : 1280,
    height: portrait ? 1280 : 720
});
camera.start();
</script>
</body>
</html>
